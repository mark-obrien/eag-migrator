# EAG v2 -> v3 mapping.
#
# Source is state/staging.sqlite, the harvest of the v2 site. Target is v3's
# HTTP API. Field names on the v3 side come from docs/v3-api.md, which was read
# off the live tenant rather than guessed.
#
#   eagm plan                 # dry run: transforms everything, writes nothing
#   eagm run --yes            # for real
#
# THE DECISION THIS ENCODES. Jobs carry their customer denormalised, exactly as
# v2 holds them, AND point at the migrated customer wherever that link could be
# established from evidence instead of guessed.
#
# The original plan was to synthesise no link at all. A real POST killed it: v3
# accepts a job with no customerKey, but then invents a customer from the job's
# own fields and does NOT deduplicate them — two jobs for one person made two
# separate customers. So "no link" meant up to 626 duplicate customers, layered
# on top of the 961 migrated in their own right. (An earlier version of this
# note also called them "second-class, invisible in the customer list" because
# of a null customerId. That was wrong — a customer created by hand in the v3
# UI has no customerId either; it is simply not assigned at creation. The
# problem is the duplication, not the records themselves.)
#
# `eagm link` therefore matches jobs to customers first, on phone, then email,
# then an unambiguous name+postcode, and refuses anything that points at more
# than one person. It links 573 of 626 (91.5%). The other 53 migrate unlinked
# and v3 makes a customer for each — accepted as the cost of not inventing 53
# links that would be wrong in silence.
#
#   eagm link                 # write the matches into staging, read the report
#   eagm plan                 # dry run: transforms everything, writes nothing
#   eagm run --yes            # for real
#
# WHAT IS NOT SETTLED YET — each is marked at the field it affects:
#   * customerType. Required, and only two codes were ever observed (7 for an
#     individual, 9 for the tenant default). The code for a business is unknown,
#     so v2's is_business currently changes nothing.
#   * locationKey. v2's job detail does not name a shop, so it cannot be
#     derived per job and every job would land at one location.
#
# NOT COVERED HERE: job_parts (609 rows) and job_notes (380). Both are child
# rows, many per job, and v3 carries them as arrays inside the job
# (jobLineItems, notes). One source row becomes one target record in this
# engine, so folding many children into one parent payload is not something the
# mapping can express today. They stay in staging until either a child endpoint
# is found or the engine learns to aggregate.

version: 1

defaults:
  batch_size: 100
  on_error: record        # collect the bad rows, keep going, report at the end

entities:

  # --- customers ----------------------------------------------------------
  # customer_details, not customers: the list screen renders four columns, the
  # JSON detail behind it returns 24 including the address and tax exemption.
  - name: customers
    source:
      table: customer_details
      key: id
    target:
      table: customers
      endpoint: /api/V1/customers
      key: key              # v3 returns the new UUID as `key`
      conflict: skip
    id_map: true            # remembers v2 id -> v3 key, so a re-run updates
    fields:
      - to: customerFullName
        from: full_name
        transform: [trim]
        required: true

      - to: emailAddress
        from: email
        transform: [trim, email]

      # v2 has its own externalAccountingId — the QuickBooks link — so this is
      # a real business field being carried across, NOT somewhere to stash the
      # v2 id.
      - to: externalAccountingId
        from: external_accounting_id
        transform: [trim, nullif_empty]
        note: >-
          NOTE: v3's customer has no externalId, so nothing on the record says
          which v2 customer it came from. The engine's own id-map keeps that
          link locally, which is enough to re-run safely, but it lives in
          state/ rather than in v3 — and a local file is exactly what was
          missing when the last attempt had to be deleted wholesale rather
          than reconciled. Worth asking EAG for a field to write it into.

      - to: taxExemptNo
        from: tax_exempt_number
        transform: [trim, nullif_empty]
      - to: taxExemptExpDate
        from: tax_exempt_expiration
        transform: [to_date]

      - to: pricingProfileKey
        const: 019fca0c-f9f2-7044-bc42-90912dbf150b
        note: the tenant's only pricing profile, read from the live snapshot

      - to: isActive
        const: true

      # REQUIRED — v3 answers "CustomerType is required." without it.
      - to: customerType
        const: 7
        note: >-
          7 is what v3 itself assigned to the customer it auto-created for an
          individual, and 9 is the tenant's default customer. NEEDS CONFIRMING
          FOR BUSINESSES: v2 has is_business, but the code v3 uses for a
          business customer was never observed, so every customer currently
          goes across as 7 regardless.

      # REQUIRED — v3 answers "Contact list cannot be null." and "At least one
      # contact is required." A v2 customer is one person, so it becomes one
      # contact carrying the same name and email.
      - to: contactList[0].firstName
        from: first_name
        transform: [trim, nullif_empty]
      - to: contactList[0].lastName
        from: last_name
        transform: [trim, nullif_empty]
      - to: contactList[0].emailAddress
        from: email
        transform: [trim, email]
      - to: contactList[0].isBusiness
        from: is_business
        transform: [bool]
      - to: contactList[0].preferredComMethod
        const: 1

      # Phones. v2 keeps phone / alt_phone / fax flat; v3 wants a list.
      # phoneType is a STRING here — v3 rejects a number with "Cannot get the
      # value of a token type 'Number' as a string" — and it is not a strict
      # enum: an invented value was accepted. "Mobile" is what the tenant's own
      # records hold.
      # v3 answers "Phone number must contain only digits" to the E.164 that
      # `phone` produces, and its own records hold ten bare digits.
      - to: phoneList[0].phoneNumber
        from: phone
        transform:
          - phone
          - digits: {last: 10}
      - to: phoneList[0].phoneType
        const: Mobile
      - to: phoneList[1].phoneNumber
        from: alt_phone
        transform:
          - phone
          - digits: {last: 10}
      - to: phoneList[1].phoneType
        const: Mobile
        note: An entry with no number is dropped before the payload is built.

      # Mailing address.
      # nullif_empty throughout: v2 stores a missing address as "", and an
      # entry of empty strings is not pruned — "" is data as far as the shape
      # is concerned. Nulls let the empty ones drop out.
      - to: addressList[0].address1
        from: address1
        transform: [trim, nullif_empty]
      - to: addressList[0].address2
        from: address2
        transform: [trim, nullif_empty]
      - to: addressList[0].city
        from: city
        transform: [trim, nullif_empty]
      - to: addressList[0].region
        from: state
        transform: [trim, upper, nullif_empty]
      - to: addressList[0].postalCode
        from: zip
        transform:
          - postal_code: {region: US}
      - to: addressList[0].country
        const: US
      # An INTEGER, not a string: v3 rejects "1" with "The JSON value could not
      # be converted to App.Domain.Enums.AddressType". 3 and 4 are the values
      # the tenant's own customer records carry.
      - to: addressList[0].addressType
        const: 3

      # Physical address, where v2 holds one that differs from the mailing one.
      # Customers without it produce an entry of nulls, which is dropped before
      # the payload is built rather than posted as an empty address.
      - to: addressList[1].address1
        from: physical_address1
        transform: [trim, nullif_empty]
      - to: addressList[1].address2
        from: physical_address2
        transform: [trim, nullif_empty]
      - to: addressList[1].city
        from: physical_city
        transform: [trim, nullif_empty]
      - to: addressList[1].region
        from: physical_state
        transform: [trim, upper, nullif_empty]
      - to: addressList[1].postalCode
        from: physical_zip
        transform: [trim, nullif_empty]
      - to: addressList[1].addressType
        const: 4
    note: >-
      customerType is deliberately not mapped. v2 has is_business, v3 has an
      integer customerType, and the only observed value is 9 on the tenant's
      default customer — which is not enough to derive a mapping. Left for v3
      to default rather than guessed at.

  # --- jobs ---------------------------------------------------------------
  - name: jobs
    source:
      table: jobs
      key: id
    target:
      table: jobs
      endpoint: /api/V1/jobs
      key: key
      conflict: skip
    id_map: true
    depends_on: [customers]   # customers must land first, to resolve the link
    fields:
      # The customer this job belongs to, where `eagm link` could establish it
      # from evidence rather than a guess: 573 of 626 (91.5%) — by phone,
      # by email, or by an unambiguous name+postcode. Run `eagm link` before
      # migrating; without it this column is empty and every job falls back to
      # the behaviour below.
      #
      # A job left unlinked is not a job left behind. v3 creates a customer
      # from the details the job carries, so the work still lands and still
      # says who it was for — that person just exists twice, once from the
      # customers migration and once from the job. 53 jobs are in that state,
      # which is the price of not inventing the other 53 links.
      - to: customerKey
        from: matched_customer_id
        transform:
          - lookup: {entity: customers}
      # The v2 job id, recorded on the record itself. The failed import wrote
      # nothing here, which is why 561 jobs could only be deleted rather than
      # matched up and resumed.
      - to: externalId
        from: id
        transform: [trim]
        required: true

      - to: tenantSpecificJobNumber
        from: order_num
        transform: [trim, nullif_empty]

      # RESOLVED. The job detail does name its shop after all — a
      # <select id="default-shop-dropdown">, which the harvest now captures as
      # `shop` (1 = Minneapolis, 2 = White Bear Lake). Map the v2 code to the
      # v3 location key. strict: an unexpected code fails the row rather than
      # silently defaulting it to a shop, because putting a job at the wrong
      # location is the kind of error nobody notices. The two keys are the
      # tenant's real ones, read from the v3 snapshot.
      - to: locationKey
        from: shop
        transform:
          - map:
              strict: true
              values:
                "1": 01a043bc-0465-7187-a5c1-71884e43e801   # Minneapolis
                "2": 01a043be-20ef-7606-a45c-d2713c568bd6   # White Bear Lake
        required: true

      - to: pricingProfileKey
        const: 019fca0c-f9f2-7044-bc42-90912dbf150b

      # The customer, denormalised. This is the decision.
      - to: customerFirstName
        from: customer_first_name
        transform: [trim]
      - to: customerLastName
        from: customer_last_name
        transform: [trim]
      - to: customerDisplayName
        from: [customer_first_name, customer_last_name]
        transform:
          - concat: {sep: " "}
          - trim
      - to: customerEmail
        from: customer_email
        transform: [trim, email]
      - to: customerPhone.phoneNumber
        from: customer_phone
        transform:
          - phone
          - digits: {last: 10}
      - to: customerPhone.phoneType
        const: Mobile

      - to: installAddress.address1
        from: customer_address1
        transform: [trim]
      - to: installAddress.address2
        from: customer_address2
        transform: [trim, nullif_empty]
      - to: installAddress.city
        from: customer_city
        transform: [trim]
      - to: installAddress.region
        from: customer_state
        transform: [trim, upper]
      - to: installAddress.postalCode
        from: customer_zip
        transform:
          - postal_code: {region: US}
      - to: installAddress.country
        const: US

      # The vehicle.
      - to: vehicle.vin
        from: vehicle_vin
        transform: [trim, upper, vin]
      - to: vehicle.year
        from: vehicle_year
        transform: [trim]
      - to: vehicle.make
        from: vehicle_make
        transform: [trim]
      - to: vehicle.model
        from: vehicle_model
        transform: [trim]
      - to: vehicle.bodyStyle
        from: vehicle_body
        transform: [trim, nullif_empty]
      - to: vehicle.plate
        from: vehicle_plate
        transform: [trim, upper, nullif_empty]
      - to: vehicle.mileage
        from: vehicle_mileage
        transform: [trim, nullif_empty]
      - to: vehicle.nagsVehicleId
        from: nags_car_id
        transform: [trim, nullif_empty]

      # Dates and the loss.
      - to: installDate
        from: install_date
        transform: [to_date]
      - to: dateOfLoss
        from: loss_date
        transform: [to_date]
      - to: referralDate
        from: referral_date
        transform: [to_date]
      - to: causeOfLoss
        from: loss_cause
        transform: [trim, nullif_empty]
      - to: poNumber
        from: order_num
        transform: [trim, nullif_empty]

      # --- fields the <select> sweep recovered -----------------------------
      # These job dropdowns were being dropped. The three below map cleanly
      # onto v3 fields whose stored format was checked against real records.

      # v2 signature-on-file is 0/1; v3 isSignatureOnFile is a bool.
      # 30 jobs have no option selected here at all; an absent signature is
      # "not on file", so coalesce those to 0 before the strict map — which
      # then guards against any value that is neither 0 nor 1.
      - to: isSignatureOnFile
        from: signature_on_file
        transform:
          - coalesce: {fallback: "0"}
          - map:
              strict: true
              values: {"0": false, "1": true}

      # v2 job-duration holds the hour count ('1', '0.5', '2') or the literal
      # 'custom' when the shop typed a bespoke length that is not in this
      # control. v3 installDuration is a float; 'custom' becomes null rather
      # than a fabricated number.
      - to: installDuration
        from: job_duration
        transform:
          - map: {values: {custom: null}}
          - float

      # v2 keeps the customer's availability window as two hour numbers; v3
      # stores customerTFStart / customerTFEnd as 'HH:MM:SS'.
      - to: customerTFStart
        from: timeframe_start
        transform: [clock]
      - to: customerTFEnd
        from: timeframe_end
        transform: [clock]

      # CAPTURED BUT NOT MAPPED — need v3's own code lists first.
      #
      #   job_type   (v2: 5=Windshield Replacement, 2=Door Glass, 1=Back Glass,
      #               4=Windshield Repair, 26=Other, 24=Calibration, 19=Roof)
      #               -> v3 jobType, an integer enum. The failed import stored 0
      #               ("Job") on every row, so v3's codes are not v2's and the
      #               real list is unknown. Sending a guessed int would silently
      #               mislabel every job.
      #   job_stage  (v2: 17=Billed, 15=Cancelled, 8=Follow Up, ...) -> v3
      #               status is a STRING (Invoice / Quote / Work Order) plus an
      #               isComplete bool — a different vocabulary, not a recode.
      #   repair_location (v2 'Mobile'; v3 stored 'inshop') — vocabularies
      #               differ and the import may have defaulted, so not trusted.
      #
      # All three are in staging (job_type_name / job_stage_name keep the
      # readable text). Map them once EAG supplies the code lists, or once a
      # test POST establishes them.
    note: >-
      SUPERSEDED DECISION, kept because the reasoning still applies: jobs were
      going to carry the customer denormalised with no link at all. A real POST
      showed v3 accepts that — but then invents a customer per job and does not
      deduplicate them, so 626 jobs would have made up to 626 extra customer
      records duplicating the 961 migrated separately. Linking where the
      evidence is unambiguous avoids 573 of those; the rest are accepted as
      duplicates rather than guessed at. (The duplication is the reason — not
      any defect in the auto-created records; a null customerId is normal, as a
      hand-created v3 customer has none either.)

      Also unmapped, deliberately: `status` and `isComplete` (v2's job detail
      carries no stage — only the 34-row jobs_board does), and `total_due`
      (v3 splits money across customerLaborTotal / customerPartsTotal /
      customerTaxTotal / customerTotalPaid, and which of those a single v2
      "total due" belongs in is not something to guess with money).
