# EAG v2 — harvest config.
#
# Originally written from a survey of the live app. It has since been RUN
# against it, and the run corrected four things the survey got wrong — each
# one is documented at the collection it affects:
#
#   * job_parts matched nothing: `div.part-numbers > div.part-number` is not a
#     direct-child relationship in the real markup (two wrappers sit between).
#   * jobs/job_parts/job_notes had `stop: 600`, but real job ids already ran to
#     750 — a full run would have silently dropped everything above 600.
#   * job_parts stored a phantom row on jobs with nothing ordered yet, because
#     `require: [job_id]` cannot reject the empty part template.
#   * job_payments' fields (div.refund-external, dl.more-info) did not exist.
#
# Note that customers/quotes/users/purchase_orders/jobs_board all worked
# unchanged — a first run that stores 0 everywhere is far more likely to be an
# expired session than a wrong config. Check the session before the selectors.
#
#   cp config/harvest.eag-v2.yaml config/harvest.yaml
#   eagm login <url>            # or set EAGM_COOKIE in .env
#   eagm harvest --limit 2      # two pages per collection, then read the report
#   eagm staging                # look at what landed before running it all
#
# What the survey established:
#   * No JSON API. Every screen is server-rendered; the only XHR on the page
#     is analytics and Google Maps. So this is all HTML extraction.
#   * Three different pagination schemes, one per screen. See each collection.
#   * Customers have no detail URL — the id exists only in a data-id attribute.
#   * The Jobs board is a curated dashboard, NOT a complete list of jobs.
#   * There is no invoices or payments screen; that data lives in job detail
#     and in the date-ranged reports under /reports.

version: 1

site:
  base_url: https://zephyrglass.everythingautoglass.com
  # An authenticated export of the owner's own records. Set deliberately:
  # the app disallows crawlers so its logged-in area is not indexed, which is
  # a rule about search engines, not about this.
  respect_robots: false
  requires_auth: true
  # The app fires analytics on page load in the browser. This client does not
  # execute JavaScript, so harvesting produces no analytics traffic at all —
  # but it is still someone's production system. One request a second.
  rate_limit_rps: 1.0
  max_pages: 5000

collections:

  # --- Customers: 740 records, offset in the path -------------------------
  # /customer/0, /customer/25, /customer/50 … page size is fixed at 25 and
  # ?limit= is ignored, so the offset has to be walked. No stop is set: past
  # the end the page comes back with no rows, and two of those in a row ends
  # it. That way this keeps working as the customer count grows.
  - name: customers
    key: id
    discover:
      sequence:
        url: /customer/{n}
        start: 0
        step: 25
        stop_after_misses: 2
    extract:
      type: html
      rows: "table#customer-table tr.customer-row"
      fields:
        - to: id
          selector: "."              # the row itself — there is no detail link
          attr: data-id
        # The name cell is  <td>Dana<span class="lname">Reyes</span></td>.
        # `own_text` reads the cell's own text and ignores the span, which is
        # the only thing separating the two halves of the name.
        - to: first_name
          selector: "td:nth-of-type(1)"
          attr: own_text
        - to: last_name
          selector: "td:nth-of-type(1) span.lname"
        - to: full_name
          selector: "td:nth-of-type(1)"
        - to: phone
          selector: "td:nth-of-type(2)"
        - to: email
          selector: "td:nth-of-type(3)"
    note: >-
      740 customers over 30 pages of 25. The Manage column holds a Delete
      button, which is a JS modal rather than a link — nothing here can reach
      it, since this client only ever issues GETs for the URLs above.

  # --- Quotes: one page, no pagination ------------------------------------
  - name: quotes
    key: id
    discover:
      static:
        urls: ["/quote"]
    extract:
      type: html
      rows: "table.defaultTbl.mainTbl tr[data-id]"
      fields:
        - to: id
          selector: "."
          attr: data-id
        - to: created
          selector: "td.quote-created"
        # Same nested-span name split as the customers list, confirmed.
        - to: customer_first
          selector: "td:nth-of-type(2)"
          attr: own_text
        - to: customer_last
          selector: "td:nth-of-type(2) span.lname"
        - to: customer_name
          selector: "td:nth-of-type(2)"
        - to: vehicle
          selector: "td:nth-of-type(3)"      # Year/Make/Model
        - to: total_price
          selector: "td:nth-of-type(4)"
        - to: sent_at
          selector: "td.sent-time"
    note: >-
      ~11 rows and an empty paginator. If the count here ever exceeds a page,
      this needs a pagination scheme like the others.

  # --- Users: one short page ----------------------------------------------
  - name: users
    key: id
    discover:
      static:
        urls: ["/user"]
    extract:
      type: html
      rows: "table.defaultTbl.mainTbl tr[id^='row-']"
      fields:
        # id="row-4" and the numbers are non-contiguous and start at 4, so
        # they are real user ids rather than a per-page sequence. Kept with
        # the prefix — it is stable and unique, and the mapping can strip it.
        - to: id
          selector: "."
          attr: id
        - to: name
          selector: "td:nth-of-type(1)"
        - to: email
          selector: "td:nth-of-type(2)"
        - to: phone
          selector: "td:nth-of-type(3)"
        - to: search_count
          selector: "td:nth-of-type(4)"
        - to: help_requests
          selector: "td:nth-of-type(5)"
        - to: account_type
          selector: "td:nth-of-type(6)"
    note: 4 rows, no pagination.

  # --- Purchase orders: 41 pages, page number in the query ----------------
  - name: purchase_orders
    key: order_id
    discover:
      sequence:
        url: /order/searchOrder?currentPage={n}
        start: 1
        stop_after_misses: 2
    extract:
      type: html
      rows: "table.defaultTbl tr.part-order"
      fields:
        - to: order_id
          selector: "td:nth-of-type(1)"      # text only — no id attribute here
        - to: distributor
          selector: "td:nth-of-type(2)"
        - to: item_no
          selector: "td:nth-of-type(3)"
        - to: quantity
          selector: "td:nth-of-type(4)"
        - to: unit_price
          selector: "td:nth-of-type(5)"
        - to: order_date
          selector: "td:nth-of-type(6)"
        - to: delivery_date
          selector: "td:nth-of-type(7)"
        - to: job
          selector: "td:nth-of-type(8)"
    note: >-
      WRAPS AROUND. Asking for a page past the last one does not return an
      empty page — the server serves page 1 again, labelled "Page 1 of 4". So
      there is no empty page to stop on, and before the harvester learned to
      notice repeated records this walked to max_pages (5,000 requests) instead
      of stopping at 6. No stop is set; the end is found by walking.
      COUNT TO CHECK: the first real run found 4 pages of 50 — 194 orders — but
      the survey recorded "Page 1 of 41". Even at the old 25-a-page assumption
      that is ~1,000 orders, so either a lot were purged or the survey misread
      it. Worth confirming against the app before trusting 194 as complete.

  # --- Jobs board: a dashboard, not a complete list -----------------------
  # Eight tables on one page, one per status group, all table.defaultTbl
  # .mainTbl. The selector below deliberately catches rows in all of them.
  - name: jobs_board
    key: id
    discover:
      static:
        urls: ["/job"]
    extract:
      type: html
      rows: "table.mainTbl tr.job-row"
      fields:
        - to: id
          selector: "."
          attr: data-id
        - to: order_number
          selector: "td:nth-of-type(1)"
        - to: due_date
          selector: "td:nth-of-type(2)"
        - to: shop
          selector: "td:nth-of-type(3)"
        - to: customer_first
          selector: "td:nth-of-type(4)"
          attr: own_text
        - to: customer_last
          selector: "td:nth-of-type(4) span.lname"
        - to: location
          selector: "td:nth-of-type(5)"
        - to: time_frame
          selector: "td:nth-of-type(6)"
        - to: installer
          selector: "td:nth-of-type(7)"
        - to: parts_status
          selector: "td:nth-of-type(8)"
        - to: stage
          selector: "td:nth-of-type(9)"
    note: >-
      WARNING — this is a status board (New Dispatches, Due Today, Overdue,
      Quotes, …), not every job. It showed 60 rows over 8 groups with no
      pagination. Use it for the board's own state; use the jobs collection
      below for the actual record set.

  # --- Jobs, walked by id -------------------------------------------------
  # The detail route is /job/manage/{id}. /job/{id} re-renders the board, so
  # pointing this at /job/{n} would harvest 900 copies of the dashboard.
  #
  # A non-existent id answers HTTP 200 with a blank, editable job form — the
  # status code cannot tell you whether there is a record there. What can is
  # `div.job[data-job-id]`, which is empty on the shell. Hence `require: [id]`:
  # a page without it is skipped and counts as a miss.
  #
  # The three job collections below all walk the same URLs. The HTTP cache
  # means only the first one costs requests; the other two read from disk.
  - name: jobs
    key: id
    discover:
      sequence:
        url: /job/manage/{n}
        start: 1
        # No `stop:` on purpose. A hard ceiling goes stale the moment the shop
        # books another job: the survey recorded 572 as the last id, and by the
        # first real run the board already showed 750 — a `stop: 600` would
        # have silently dropped every job from 601 up, with nothing in the
        # report to say so. The end is found by walking until the blanks add
        # up, which keeps working as ids grow. site.max_pages still bounds it.
        #
        # The budget must exceed the largest run of blanks *inside* the range —
        # the board showed ids from 114, so a leading gap of 113 is possible
        # and a smaller budget would stop before the first real job.
        stop_after_misses: 300
    extract:
      type: html
      # No `rows:` — a detail page is one record, so selectors read the page.
      require: [id]
      fields:
        - to: id
          selector: "div.job"
          attr: data-job-id
        # Every value node carries a stable semantic id, so these are direct.
        # The customer is denormalised onto the job — see the note below.
        - to: customer_first_name
          selector: "#job-customer-fname"
        - to: customer_last_name
          selector: "#job-customer-lname"
        - to: customer_account
          selector: "#job-customer-account"
        - to: customer_phone
          selector: "#job-customer-phone"
        - to: customer_email
          selector: "#job-customer-email"
        - to: customer_address1
          selector: "#job-customer-address1"
        - to: customer_address2
          selector: "#job-customer-address2"
        - to: customer_city
          selector: "#job-customer-city"
        - to: customer_zip
          selector: "#job-customer-zip"
        # State is the one field addressed by class rather than by id.
        # NOT `.job-state` — that div holds a <p> with the value AND a <select>
        # of all 50 states, so reading the div returned "MN Select a state...
        # Alabama Alaska Arizona..." on all 626 jobs. The <p> is the value.
        - to: customer_state
          selector: ".job-state p"
        - to: vehicle_vin
          selector: "#job-vehicle-vin"
        - to: vehicle_year
          selector: "#job-vehicle-year"
        - to: vehicle_make
          selector: "#job-vehicle-make"
        - to: vehicle_model
          selector: "#job-vehicle-model"
        - to: vehicle_body
          selector: "#job-vehicle-body"
        - to: vehicle_plate
          selector: "#job-vehicle-plate"
        - to: vehicle_mileage
          selector: "#job-vehicle-mileage"
        - to: nags_car_id
          selector: "#job-vehicle-nagscarid"
        - to: order_num
          selector: "#job-order-num"
        # The shop the job belongs to. A <select id="default-shop-dropdown">
        # with value 1 = Minneapolis, 2 = White Bear Lake — take the selected
        # option's value, not its text (the text is padded with a wall of
        # whitespace). Populated on all 626 jobs: 458 WBL, 168 Minneapolis. The
        # mapping turns these into v3 locationKeys; before this was captured,
        # every job was forced to White Bear Lake, misplacing the 168.
        - to: shop
          selector: "#default-shop-dropdown option[selected]"
          attr: value
        - to: install_date
          selector: "#job-install-date"
        # NOT USABLE AS A TIME, and not mapped to v3. #job-install-time is
        # three <select>s — hour, minute, AM/PM. Reading the div returned
        # "-- 1 2 3 4 ... AM/PM AM PM" (the options) on every job; reading the
        # selected options gets the hour alone, on only 42 of 626 jobs, with no
        # minute and no AM/PM. So the time is mostly applied by JavaScript and
        # is not in the HTML this client fetches. Left in place at the corrected
        # selector so the column holds something true rather than a list of
        # options, but a real time would have to come from a browser.
        - to: install_time
          selector: "#job-install-time option[selected]"
        - to: glass_order_date
          selector: "#job-glass-order-date"
        - to: glass_arrival_date
          selector: "#job-glass-arrival-date"
        - to: referral_date
          selector: "#job-referral-date"
        - to: loss_date
          selector: "#job-loss-date"
        # The selected option, not the whole <select> — reading the element
        # returned every cause concatenated on all 626 jobs.
        #
        # Read correctly this is genuine per-job data, but it takes the whole
        # set to see that: 617 of 626 are "Rock from Road - No One at Fault",
        # so any small sample looks like a stuck default. It is not — the
        # remainder are vandalism (8) and a tree branch (1).
        - to: loss_cause
          selector: "#job-loss-cause option[selected]"
        - to: total_due
          selector: "#job-total-due"
        - to: salesperson
          selector: "#job-salesperson"
        - to: salesperson_user_id
          selector: "#job-salesperson"
          attr: data-id
        # A <select> — its text would be every option concatenated, so take
        # only the id it carries.
        - to: installer_user_id
          selector: "#job-installer"
          attr: data-id
    note: >-
      THE CUSTOMER IS DENORMALISED ONTO THE JOB. There is no customer id
      anywhere in this page — no data-customer-id, no hidden input, no link to
      /customer/{id}. Jobs can only be reattached to customers by matching on
      name, phone, email and address. Read the note at the bottom of this file
      before designing that; it is the highest-risk part of the migration.

  # --- Glass parts, one row per line item on a job ------------------------
  - name: job_parts
    discover:
      sequence:
        url: /job/manage/{n}
        start: 1
        # See the jobs collection above for why there is no `stop:`.
        stop_after_misses: 300
    extract:
      type: html
      # NOT `div.part-numbers > div.part-number`. The real markup puts two
      # wrappers in between — div.accordion.sortable, then a <section> — so the
      # direct-child combinator matched nothing on every job, which is why this
      # collection stored 0 on the first run. Descendant, not child.
      rows: "div.part-numbers div.part-number"
      # A part needs a job to hang off, and a part number to be a part at all.
      # `job_id` alone is not enough: it is read from the page rather than the
      # row, so it is filled even on the empty `div.part-number` template that
      # a job with nothing ordered yet still renders (job 750 at the time of
      # writing). That would store a phantom part on every such job. Across the
      # jobs sampled, every real part had all four part fields populated and
      # the template had none, so part_number separates them cleanly.
      require: [job_id, part_number]
      fields:
        # `page` reads the document rather than the row — the job's id is in
        # the page header, outside every part block.
        - to: job_id
          selector: "div.job"
          attr: data-job-id
          source: page
        - to: part_number
          selector: ".job-part-number"
        - to: nags_part_number
          selector: ".job-nags-part-number"
        - to: nags_description
          selector: ".job-nags-part-description"
        - to: nags_colour
          selector: ".job-nags-part-color-description"
    note: >-
      The surveyed job had a single part block; jobs with several will produce
      several rows. `.job-part-type` is a form control rather than text and is
      left out until its markup is known.

  # --- Notes, one row per note on a job -----------------------------------
  - name: job_notes
    key: note_id
    discover:
      sequence:
        url: /job/manage/{n}
        start: 1
        # See the jobs collection above for why there is no `stop:`.
        stop_after_misses: 300
    extract:
      type: html
      rows: "table.notes-table tr.notes-table-row"
      require: [note_id]
      fields:
        - to: job_id
          selector: "div.job"
          attr: data-job-id
          source: page
        # The note's id is the checkbox value (its name is "note-<id>").
        - to: note_id
          selector: "td.print-on-invoice input"
          attr: value
        - to: heading
          selector: "td.sequential-notes h3"
          attr: own_text
        - to: created_at
          selector: "td.sequential-notes h3 span.is-raw-datetime"
        - to: body
          selector: "td.sequential-notes p"
        - to: print_on_invoice
          selector: "td.print-on-invoice input[checked]"
          attr: value

  # --- Customer detail: the only JSON in the whole app --------------------
  # /customer/getcustomerdata/{id} returns 24 fields as JSON — far more than
  # the four columns the list screen renders, including the address, the tax
  # exemption, and the account number. This is the real customer source; the
  # list above exists to supply the ids.
  - name: customer_details
    key: id
    discover:
      from_collection:
        name: customers
        column: id
        url: /customer/getcustomerdata/{value}
    extract:
      type: json
      require: [id]
      fields:
        - to: id
          path: id
        - to: full_name
          path: fullName
        - to: first_name
          path: firstName
        - to: last_name
          path: lastName
        - to: email
          path: email
        - to: phone
          path: phone
        - to: alt_phone
          path: altPhone
        - to: fax
          path: fax
        - to: address1
          path: address1
        - to: address2
          path: address2
        - to: city
          path: city
        - to: state
          path: state
        - to: zip
          path: zip
        - to: physical_address1
          path: physicalAddress1
        - to: physical_address2
          path: physicalAddress2
        - to: physical_city
          path: advancedCity
        - to: physical_state
          path: advancedState
        - to: physical_zip
          path: advancedZip
        - to: tax_exempt_number
          path: taxExemptNumber
        - to: tax_exempt_expiration
          path: taxExemptExpirationDate
        - to: payment_mode
          path: paymentMode
        - to: external_accounting_id
          path: externalAccountingId
        - to: account_number
          path: accountNumber
        - to: is_business
          path: isBusiness
    note: >-
      JSON, GET, id in the path, idempotent. `accountNumber` matches the job's
      job-customer-account where both are populated — a real shared key, but
      sparsely filled (business customers only), so a hint rather than a join.
      `externalAccountingId` is probably the QuickBooks link and maps
      straight onto v3's field of the same name.

  # --- Payments, per job ---------------------------------------------------
  # The rows the job's Payments tab loads over AJAX. No cardholder data was
  # found anywhere in these across a full sweep of the paying jobs — no PAN,
  # no last four, no CVV, no expiry, no brand. The only processor identifier
  # is a Stripe charge id in data-payment-id, which is a reference, not
  # cardholder data. The scrubber still runs over every row regardless.
  - name: job_payments
    discover:
      from_collection:
        name: jobs
        column: id
        url: /payment/gettablerows/{value}
        as: job_id
    extract:
      type: html
      # Confirmed: the endpoint answers a bare <tr> with no table around it,
      # and lxml wraps it such that `tr` matches. A job with no payments
      # answers 0 bytes, so it contributes no rows at all.
      rows: "tr"
      # job_id is the carry value and is therefore always set — it cannot tell
      # a real payment from a placeholder row. The amount can.
      require: [job_id, amount]
      fields:
        - to: amount
          selector: "td.amount"
        - to: paid_at
          selector: "td:nth-of-type(2)"
        - to: status
          selector: "span.badge"
        - to: processor
          selector: "td.payment-processor"
        # The last cell carries an info icon as well as its text, so read the
        # cell's own text and ignore the <i>.
        - to: description
          selector: "td:nth-of-type(6)"
          attr: own_text
    note: >-
      Rewritten against a real response. The previous selectors
      (div.refund-external, dl.more-info dt/dd) do not exist in the fragment —
      they were guesses and matched nothing. No cardholder data appears here,
      and there is no data-payment-id either, so the Stripe charge id this
      file used to warn about is not in this response at all. CAVEAT: only one
      paying job was available to read when these were written, so confirm the
      cell positions against the samples in the first full run's report.

  # --- Which jobs belong to which customer --------------------------------
  # The app will not give us a foreign key, but it will answer the question:
  # /customer/jobquotesmodal/{id} returns that customer's completed jobs. The
  # rows carry no ids — only Vehicle, Part Number, Created and Stage as text —
  # so this is not a join key by itself. What it is, is the app *asserting*
  # membership: these jobs are this customer's. Match those four columns
  # against the jobs collection and the link is reconstructed from the
  # server's own answer rather than from guessing at names.
  #
  # The URLs come from the customers already harvested, so only ids that exist
  # are fetched — customer ids are not a contiguous range (the surveyed one
  # was 794 with 740 customers). `as: customer_id` records which customer each
  # row came from, which is the whole point.
  #
  # Confirmed GET, idempotent, no CSRF header, id in the path. Requesting it
  # directly also avoids the POST /job/checkchangeinshopid that the UI fires
  # when a job modal is opened — see the note at the end of this file.
  - name: customer_jobs
    discover:
      from_collection:
        name: customers
        column: id
        url: /customer/jobquotesmodal/{value}
        as: customer_id
    extract:
      type: html
      # A customer with no jobs still renders one .nags-row — the "There are no
      # Jobs assigned to this customer" message — and the only thing marking it
      # is that its single cell carries .full-width. Excluding the header row
      # is not enough: on the first full run 949 of the 965 rows harvested here
      # were that message, and `require: [customer_id]` cannot reject them
      # because customer_id is the carry value and is always set.
      rows: "#tab-job .nags-row:not(.nags-header-row):not(:has(.nags-column.full-width))"
      require: [customer_id]
      fields:
        - to: vehicle
          selector: ".nags-column:nth-of-type(1)"
        # ALWAYS EMPTY — the column exists and is headed "Part Number", but the
        # app never populates it: 0 of 965 harvested rows had a value. The
        # selector is correct; the data is simply not in this response. This
        # matters, because the join described at the end of this file was to be
        # made on vehicle + part_number + created. Read that note before using
        # this field for anything.
        - to: part_number
          selector: ".nags-column:nth-of-type(2)"
        - to: created
          selector: ".nags-column:nth-of-type(3)"
        - to: stage
          selector: ".nags-column:nth-of-type(4)"

  - name: customer_quotes
    discover:
      from_collection:
        name: customers
        column: id
        url: /customer/jobquotesmodal/{value}
        as: customer_id
    extract:
      type: html
      # Same empty-state row as customer_jobs above — 951 of the 961 rows
      # harvested on the first full run were "There are no Quotes assigned to
      # this customer".
      rows: "#tab-quotes .nags-row:not(.nags-header-row):not(:has(.nags-column.full-width))"
      require: [customer_id]
      fields:
        - to: vehicle
          selector: ".nags-column:nth-of-type(1)"
        # ALWAYS EMPTY, like part_number on the jobs tab: the "Sent" column is
        # rendered but never filled — 0 of 961 rows had a value.
        - to: sent
          selector: ".nags-column:nth-of-type(2)"
        - to: total_due
          selector: ".nags-column:nth-of-type(3)"
    note: >-
      Same fetch as customer_jobs, different tab — the second run costs no
      requests because the response is already in the HTTP cache.

  # --- Payments: NOT YET, and not from this page --------------------------
  # The payments table on the job detail is populated over AJAX
  # (/payment/gettablerows/…, /job/getinvoicerows/…), so it is empty in the
  # HTML this client fetches. The surveyed job had no payments, so the row
  # markup is unknown either way.
  #
  # Those endpoints are the way in — they take a job id and return the rows.
  # Fetch one by hand first to see whether it answers JSON or an HTML
