# ---------------------------------------------------------------------------
# THE ONE THAT NEEDS A DECISION: jobs have no customer id.
#
# The customer is copied onto each job as flat fields. The integer that
# identifies a customer on /customer never appears on the job, so after
# harvesting there is no key to join on and the link has to be reconstructed
# from the data itself.
#
# It was checked properly and it is genuinely absent: the job detail carries
# no customer id, and /customer/jobquotesmodal/{id} — which knows perfectly
# well which jobs are whose — renders them with no ids at all.
#
# That endpoint was going to be the answer: the server telling us which jobs
# belong to customer 794, captured by the `customer_jobs` collection above.
# The plan was to rebuild the link by matching customer_jobs against jobs on
#
#     vehicle + part_number + created
#
# THE FIRST FULL RUN BROKE THAT PLAN, IN TWO WAYS. Both were measured, not
# guessed, and neither is worked around anywhere in this file — they are a
# decision for a person, which is why they are written down rather than fixed.
#
#   1. part_number is never populated. The modal renders the column and leaves
#      it blank on every row — 0 of 965. So the composite that actually exists
#      is vehicle + created, which no longer distinguishes two jobs for one
#      customer on the same day, nor two customers who each had a 2015 Toyota
#      4Runner done on the same date.
#
#   2. The endpoint covers almost nothing. Of 961 customers, 12 had any jobs
#      listed at all, totalling 16 rows — against 626 jobs harvested. It was
#      checked directly rather than inferred: customers who demonstrably have
#      a job (matched by name against the job's own denormalised fields) still
#      return an empty jobs tab. It appears to list only completed work.
#
# So this endpoint can authoritatively link about 2% of the jobs, and the
# other ~98% have no server-asserted owner anywhere in v2. The fallbacks below
# are therefore not a long stop — they are the main path, and that changes the
# risk of this migration rather than just its effort.
#
# DECIDED (2026-09-10, by the shop owner): DO NOT SYNTHESISE THE LINK.
#
# Jobs are migrated with their customer fields denormalised, exactly as v2
# holds them. No name/phone/email matching is performed, and no customer
# reference is invented for a job. A wrong link is silent — the job simply
# belongs to the wrong person in v3 and nothing downstream complains — and at
# ~2% server-asserted coverage the matching would have been guesswork for
# nearly every job.
#
# What that costs is the relationship, not the data. Measured on the 626 jobs
# harvested, the customer fields carried on the job itself are:
#
#     state 100%, phone 97.8%, last_name 96.6%, city 94.2%, address1 92.3%,
#     zip 92.0%, first_name 81.0%, email 78.4%, account_number 2.6%
#
# So each job still says who it was for; it just does not point at a customer
# record. The fallbacks listed below are therefore NOT to be implemented.
# They are kept only to document what was considered and rejected.
#
# The consequence to design around: a person can end up in v3 twice — once as
# a customer record from the customers collection, and once as text on a job.
# Whether that is acceptable, or whether jobs should carry no customer text at
# all, depends on what v3's job entity actually accepts. That is not yet
# known: no job-create endpoint has been established, only POST
# /api/V1/jobs/search for reading. Run `eagm v3-snapshot` and settle it from
# the real field names before writing the jobs half of the mapping.
#
# Do not match on name. 740 customers in one town will contain repeated
# names, and a wrong link is silent — the job simply belongs to the wrong
# person in v3, and nothing downstream complains.
#
# If the composite above leaves jobs unmatched, fall back in this order:
#   1. Account number, if it turns out to be populated on real records. It
#      was empty on the surveyed job, so check a B2B one before relying on it.
#   2. Normalised phone — digits only, last 10. Strongest of the free-text
#      fields on the job and the most likely to be unique.
#   3. Lowercased email, where present.
#   4. Last name + zip, only to break ties, never on its own.
#
# Whatever the rule, count it before trusting it: how many jobs match exactly
# one customer, how many match none, how many match several. Migrate the
# unambiguous ones, and leave the rest for a person to resolve rather than
# letting the tool guess. `eagm plan` will show the lookup failures; treat a
# non-zero ambiguous count as a stop, not a warning.
# ---------------------------------------------------------------------------

# Not harvestable as lists, and why:
#
#   /distributorpartssearch, /nags   search-gated — no rows until a query is
#                                    submitted. Reference catalogues, not shop
#                                    records; v3 will have its own.
#   /invoice                         blank. Invoicing lives in job detail.
#   /customer "Export CSV"           a built-in customer export, JS-driven
#                                    with no href. Worth running by hand: an
#                                    independent copy of the customer list is
#                                    the only real cross-check on the scrape.
#   /reports/*                       date-ranged reports with CSV/XLS export.
#                                    Not a raw table dump, so they do not
#                                    replace row-level extraction — but
#                                    "Customer Details Report" and "A/R Aging"
#                                    are worth exporting by hand as a
#                                    cross-check against what lands here.
#
# A note on why this reads pages directly rather than driving a browser.
#
# Opening a job in the UI fires POST /job/checkchangeinshopid alongside the
# GET. Nobody has established what that POST does. Requesting
# /job/manage/{id} directly gets the identical HTML fragment — the modal body
# and the "detail page" are the same response — without the POST. Every URL
# in this file is a GET, confirmed idempotent, so a full harvest issues no
# request that could change anything.
#
# After harvesting:
#
#   V2_DATABASE_URL=sqlite:////app/state/staging.sqlite
#   eagm discover --side v2 && eagm scaffold
#
# From there it is an ordinary v2 database. Cleaning the values up is the
# mapping's job — `phone`, `decimal`, `to_datetime`, `trim` all apply.
